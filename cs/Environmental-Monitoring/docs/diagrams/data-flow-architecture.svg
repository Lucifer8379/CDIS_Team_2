<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <rect width="920" height="420" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="52" rx="8" fill="#1e3a8a"/>
  <rect x="0" y="40" width="920" height="12" fill="#1e3a8a"/>
  <text x="460" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">
    System Architecture &amp; Environmental Measurement Flow
  </text>
  <text x="460" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#dbeafe">
    Cloud Infrastructure and Services (CDIS - 25CS2206E) | Modular Vendor-Neutral Design
  </text>

  <!-- Column 1: Data Sources -->
  <rect x="24" y="74" width="200" height="318" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
  <text x="124" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Sensing &amp; Source Layer</text>

  <rect x="40" y="118" width="168" height="106" rx="5" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="124" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">SimulatedSensorAdapter</text>
  <text x="124" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">Active in SIMULATION Mode</text>
  <text x="124" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#3730a3" font-weight="600">isSimulated: true</text>
  <text x="124" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">(Software Demo &amp; QA)</text>

  <rect x="40" y="250" width="168" height="118" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="124" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Physical Sensor + MCU</text>
  <text x="124" y="294" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Temp &amp; %RH Sensor (TBD)</text>
  <text x="124" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Controller / Gateway (TBD)</text>
  <text x="124" y="334" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#0f766e">ExternalIngestAdapter</text>
  <text x="124" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">(Pending Team Selection)</text>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="208" y1="170" x2="262" y2="170" stroke="#1d4ed8" stroke-width="2"/>
  <polygon points="262,166 270,170 262,174" fill="#1d4ed8"/>
  <line x1="208" y1="308" x2="262" y2="230" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <polygon points="259,227 268,224 265,233" fill="#64748b"/>

  <!-- Column 2: Application / Compute Tier -->
  <rect x="272" y="74" width="236" height="318" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="390" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">Application &amp; Processing Tier</text>
  <text x="390" y="114" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#166534">Stateless Node.js HTTP Compute</text>

  <rect x="290" y="128" width="200" height="52" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="390" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">HTTP API (src/server.js)</text>
  <text x="390" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">/api/readings &bull; /api/simulate &bull; /api/health</text>

  <rect x="290" y="194" width="200" height="56" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="390" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">readingValidator.js</text>
  <text x="390" y="233" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Schema, Bounds &amp; °C/°F Normaliser</text>

  <rect x="290" y="264" width="200" height="56" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="390" y="285" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">thresholdMonitor.js</text>
  <text x="390" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">NORMAL / WARNING / ALERT &amp; Stats</text>

  <rect x="290" y="332" width="200" height="44" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="390" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">config.js (.env Settings)</text>
  <text x="390" y="367" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Zero Hardcoded Credentials</text>

  <!-- Arrows Col 2 <-> Col 3 -->
  <line x1="508" y1="154" x2="554" y2="154" stroke="#166534" stroke-width="2"/>
  <polygon points="554,150 562,154 554,158" fill="#166534"/>

  <line x1="508" y1="318" x2="554" y2="318" stroke="#0f766e" stroke-width="2"/>
  <polygon points="554,314 562,318 554,322" fill="#0f766e"/>

  <!-- Column 3 Top: Presentation Tier -->
  <rect x="564" y="74" width="332" height="164" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="730" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1e3a8a">Presentation Tier (Web Client)</text>

  <rect x="582" y="112" width="142" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="653" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">KPI Metric Cards</text>
  <text x="653" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Temp, %RH, Status</text>

  <rect x="736" y="112" width="142" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="807" y="133" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">SVG Trend Charts</text>
  <text x="807" y="149" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Normal Operating Bands</text>

  <rect x="582" y="172" width="296" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="730" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Measurement Log &amp; Threshold Controls</text>
  <text x="730" y="209" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#3730a3">Explicit SIMULATED vs EXTERNAL INGEST Badges</text>

  <!-- Column 3 Bottom: Persistence Tier -->
  <rect x="564" y="254" width="332" height="138" rx="6" fill="#fefce8" stroke="#facc15"/>
  <text x="730" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#854d0e">Data Persistence Abstraction Tier</text>

  <rect x="582" y="294" width="142" height="82" rx="4" fill="#ffffff" stroke="#fde047"/>
  <text x="653" y="317" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">In-Memory Buffer</text>
  <text x="653" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Active Ring Buffer</text>
  <text x="653" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#166534">(Bounded RAM Usage)</text>

  <rect x="736" y="294" width="142" height="82" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="807" y="317" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#334155">Cloud Database</text>
  <text x="807" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">SQL / Time-Series</text>
  <text x="807" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">(Pending Selection)</text>
</svg>

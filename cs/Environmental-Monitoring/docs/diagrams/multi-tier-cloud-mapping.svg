<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <rect width="880" height="360" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="0" y="0" width="880" height="48" rx="8" fill="#0f172a"/>
  <rect x="0" y="36" width="880" height="12" fill="#0f172a"/>
  <text x="440" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">
    CO1 &amp; CO2 Academic Mapping: Multi-Tier Architecture &amp; Compute Portability
  </text>

  <!-- CO1 Box -->
  <rect x="28" y="68" width="400" height="266" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="228" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">
    CO1: Cloud Fundamentals &amp; Multi-Tier Structure
  </text>

  <rect x="48" y="112" width="360" height="54" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="228" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tier 1: Presentation Layer (src/index.html, app.js)</text>
  <text x="228" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Broad network access via standard browser UI</text>

  <rect x="48" y="178" width="360" height="54" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="228" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tier 2: Stateless Compute Layer (src/server.js)</text>
  <text x="228" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Shared responsibility: input validation &amp; .env secret hygiene</text>

  <rect x="48" y="244" width="360" height="68" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="228" y="266" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Tier 3: Pluggable Persistence &amp; Edge Adapters</text>
  <text x="228" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Supports Public, Private, or Hybrid campus deployments</text>
  <text x="228" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a">IaaS or PaaS compatible without vendor lock-in</text>

  <!-- CO2 Box -->
  <rect x="452" y="68" width="400" height="266" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="652" y="94" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#14532d">
    CO2: Compute Hosting, Sizing &amp; Scaling Options
  </text>

  <rect x="472" y="112" width="172" height="92" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="558" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Virtual Machine (VM)</text>
  <text x="558" y="154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Right-sized micro/burstable</text>
  <text x="558" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">instance for continuous</text>
  <text x="558" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#166534">24x7 facility monitoring</text>

  <rect x="660" y="112" width="172" height="92" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="746" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Containers / K8s</text>
  <text x="746" y="154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">Zero-dependency image;</text>
  <text x="746" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#475569">/api/health probe ready;</text>
  <text x="746" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#166534">horizontal autoscaling</text>

  <rect x="472" y="218" width="360" height="94" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="652" y="241" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Serverless Functions &amp; Resource Governance</text>
  <text x="652" y="261" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Pure validator &amp; threshold functions map cleanly to FaaS</text>
  <text x="652" y="279" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">Bounded ring buffer prevents heap exhaustion; /api/health</text>
  <text x="652" y="297" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#166534">reports live RSS/Heap memory for empirical compute sizing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580">
  <rect width="900" height="580" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="900" height="54" rx="8" fill="#1e3a8a"/>
  <rect x="0" y="42" width="900" height="12" fill="#1e3a8a"/>
  <text x="24" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    Environmental Monitoring using Temperature and Humidity Sensors
  </text>
  <text x="24" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#dbeafe">
    CDIS (25CS2206E) — Dashboard Interface Wireframe
  </text>
  <rect x="690" y="16" width="186" height="24" rx="4" fill="#3b82f6"/>
  <text x="783" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">
    Mode: Simulated Demonstration
  </text>

  <!-- Disclosure Banner -->
  <rect x="24" y="68" width="852" height="34" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="38" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1e3a8a">
    [Disclosure Banner] Simulated Demonstration Mode Notice: Synthetic values explicitly tagged SIMULATED (Hardware Pending)
  </text>

  <!-- 4 KPI Cards -->
  <rect x="24" y="116" width="201" height="92" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">TEMPERATURE</text>
  <rect x="142" y="124" width="72" height="16" rx="3" fill="#e0e7ff"/>
  <text x="178" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#3730a3">SIMULATED</text>
  <text x="38" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">23.6 °C</text>
  <text x="38" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Min / Avg / Max (°C)</text>

  <rect x="241" y="116" width="201" height="92" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="255" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">RELATIVE HUMIDITY</text>
  <rect x="359" y="124" width="72" height="16" rx="3" fill="#e0e7ff"/>
  <text x="395" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#3730a3">SIMULATED</text>
  <text x="255" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">48.4 % RH</text>
  <text x="255" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Min / Avg / Max (%)</text>

  <rect x="458" y="116" width="201" height="92" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="472" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">ENVIRONMENTAL STATUS</text>
  <rect x="582" y="124" width="66" height="16" rx="3" fill="#dcfce7"/>
  <text x="615" y="135" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#166534">NORMAL</text>
  <text x="472" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">NORMAL</text>
  <text x="472" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Normal / Warning / Alert Counts</text>

  <rect x="675" y="116" width="201" height="92" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="689" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#475569">BUFFER &amp; PROVENANCE</text>
  <text x="689" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">6 / 100</text>
  <text x="689" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Simulated vs Ingested Count</text>

  <!-- Trend Charts Row -->
  <rect x="24" y="222" width="852" height="132" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
    Temperature (°C) &amp; Relative Humidity (% RH) Time-Series Trend Charts
  </text>

  <rect x="38" y="252" width="404" height="88" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="64" y="274" width="360" height="36" fill="#dcfce7" opacity="0.7"/>
  <polyline fill="none" stroke="#1d4ed8" stroke-width="2" points="68,298 130,290 195,294 260,285 330,288 415,282"/>
  <text x="240" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Temperature Trend + Shaded Normal Band (18–28 °C)</text>

  <rect x="458" y="252" width="404" height="88" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="484" y="274" width="360" height="36" fill="#dcfce7" opacity="0.7"/>
  <polyline fill="none" stroke="#0f766e" stroke-width="2" points="488,292 550,296 615,286 680,290 750,284 835,289"/>
  <text x="660" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Relative Humidity Trend + Shaded Normal Band (30–65 % RH)</text>

  <!-- Controls Split Row -->
  <rect x="24" y="368" width="418" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Demonstration &amp; Payload Ingestion Controls</text>
  <rect x="38" y="398" width="112" height="22" rx="3" fill="#1d4ed8"/>
  <text x="94" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#ffffff">+ Simulated Sample</text>
  <rect x="158" y="398" width="126" height="22" rx="3" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="221" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">POST /api/readings Form</text>
  <text x="38" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">Test normal/warning/alert profiles or submit custom JSON readings</text>

  <rect x="458" y="368" width="418" height="90" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="472" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Configurable Advisory Thresholds</text>
  <rect x="472" y="398" width="180" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="562" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Temp Min / Max / Margin (°C)</text>
  <rect x="662" y="398" width="198" height="22" rx="3" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="761" y="413" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Humidity Min / Max / Margin (%)</text>
  <text x="472" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b">PUT /api/thresholds dynamically re-evaluates buffered samples</text>

  <!-- Measurement Log Table -->
  <rect x="24" y="472" width="852" height="92" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Environmental Measurement Log Table</text>
  <rect x="38" y="502" width="824" height="22" fill="#f1f5f9"/>
  <text x="48" y="517" font-family="Consolas, monospace" font-size="9.5" fill="#334155">ID       | Timestamp            | Zone / Node        | Temp (°C/°F)    | Humidity  | Condition | Data Origin</text>
  <text x="48" y="542" font-family="Consolas, monospace" font-size="9.5" fill="#0f172a">RD-00006 | 25 Nov 2026 10:05:00 | Simulated Lab Zone | 23.6 °C (74.5°F)| 48.4 % RH | [NORMAL]  | [SIMULATED]</text>
</svg>
